<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>摄像头设备自查工具</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(145deg, #eef2f5 0%, #d9e0e8 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            padding: 20px;
        }
        .card {
            max-width: 800px;
            width: 100%;
            background: rgba(255,255,245,0.95);
            backdrop-filter: blur(2px);
            border-radius: 48px;
            box-shadow: 0 20px 35px rgba(0,0,0,0.2);
            overflow: hidden;
            padding: 24px 28px 32px;
            transition: all 0.2s;
        }
        h1 {
            font-size: 1.8rem;
            font-weight: 600;
            background: linear-gradient(135deg, #1f6e8c, #0e4a6b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .sub {
            color: #4a627a;
            border-left: 4px solid #ffb347;
            padding-left: 16px;
            margin: 8px 0 20px 0;
            font-size: 0.9rem;
        }
        .device-list {
            background: #f8fafd;
            border-radius: 28px;
            padding: 16px 20px;
            margin: 16px 0;
            border: 1px solid #cbdde9;
        }
        .device-item {
            padding: 12px 0;
            border-bottom: 1px solid #e2edf2;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .device-item:last-child {
            border-bottom: none;
        }
        .device-name {
            font-weight: 600;
            color: #1e4663;
            flex: 2;
            word-break: break-word;
        }
        .device-id {
            font-size: 0.7rem;
            color: #6c8fae;
            font-family: monospace;
            flex: 1;
            min-width: 120px;
        }
        .badge {
            background: #e9ecef;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: bold;
        }
        .badge.active {
            background: #c7f0d2;
            color: #0f6e3f;
        }
        .badge.inactive {
            background: #ffe0d9;
            color: #b13e3e;
        }
        .preview {
            margin: 20px 0;
            background: #111;
            border-radius: 32px;
            overflow: hidden;
            aspect-ratio: 16 / 9;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            background: #000;
        }
        .placeholder {
            color: #ccc;
            text-align: center;
            padding: 30px;
            background: #2a2f36;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
        }
        .btn-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin: 12px 0 8px;
        }
        button {
            background: #2c7da0;
            border: none;
            padding: 10px 22px;
            border-radius: 60px;
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        button:hover {
            background: #1f5e7e;
            transform: scale(0.98);
        }
        .status-msg {
            background: #eef3fc;
            border-radius: 40px;
            padding: 12px 18px;
            font-size: 0.85rem;
            margin: 12px 0;
            color: #1c4e6e;
        }
        .error-msg {
            background: #ffe8e0;
            color: #bc3900;
            border-left: 5px solid #ff8c42;
        }
        hr {
            margin: 16px 0;
            border-color: #d4e2ed;
        }
        footer {
            font-size: 0.7rem;
            text-align: center;
            color: #7f8c9a;
            margin-top: 20px;
        }
        @media (max-width: 600px) {
            .card { padding: 20px; }
            .device-name { font-size: 0.85rem; }
        }
    </style>
</head>
<body>
<div class="card">
    <h1>📷 摄像头设备自查</h1>
    <div class="sub">检测电脑上所有可用摄像头 · 权限测试 · 实时预览</div>

    <div class="status-msg" id="permStatus">🔍 正在请求摄像头权限并枚举设备...</div>

    <div class="device-list" id="deviceListArea">
        <div style="text-align: center; color: #6c86a3;">⏳ 加载设备列表中...</div>
    </div>

    <div class="btn-group">
        <button id="refreshBtn">🔄 刷新设备列表</button>
        <button id="stopPreviewBtn">⏹️ 停止预览</button>
    </div>

    <div class="preview" id="previewArea">
        <div class="placeholder" id="previewPlaceholder">🎥 选择下方摄像头开始预览</div>
        <video id="previewVideo" autoplay playsinline muted style="display: none;"></video>
    </div>

    <div class="status-msg" id="detailMsg">💡 提示：点击设备列表中的「预览」按钮即可测试该摄像头画面。</div>
    <footer>🔒 所有检测均在本地完成，不会上传任何图像数据。需要授予摄像头权限才能枚举设备。</footer>
</div>

<script>
    (function() {
        // DOM 元素
        const permStatusDiv = document.getElementById('permStatus');
        const deviceListArea = document.getElementById('deviceListArea');
        const refreshBtn = document.getElementById('refreshBtn');
        const stopPreviewBtn = document.getElementById('stopPreviewBtn');
        const previewVideo = document.getElementById('previewVideo');
        const previewPlaceholder = document.getElementById('previewPlaceholder');
        const detailMsgDiv = document.getElementById('detailMsg');

        let currentStream = null;      // 当前预览的流
        let currentDeviceId = null;     // 当前预览的设备ID

        // 停止当前预览
        function stopPreview() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
            previewVideo.style.display = 'none';
            previewPlaceholder.style.display = 'flex';
            currentDeviceId = null;
            detailMsgDiv.innerHTML = '✅ 已停止预览。可点击设备列表中的「预览」重新测试。';
        }

        // 开始预览指定设备
        async function startPreview(deviceId, deviceLabel) {
            stopPreview();  // 先关闭之前的流
            if (!deviceId) {
                detailMsgDiv.innerHTML = '⚠️ 无效的设备ID，无法预览。';
                return;
            }
            try {
                const constraints = {
                    video: {
                        deviceId: { exact: deviceId },
                        width: { ideal: 640 },
                        height: { ideal: 480 }
                    }
                };
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                currentStream = stream;
                previewVideo.srcObject = stream;
                previewVideo.style.display = 'block';
                previewPlaceholder.style.display = 'none';
                currentDeviceId = deviceId;
                detailMsgDiv.innerHTML = `🎬 正在预览: ${deviceLabel || '摄像头'} —— 画面已镜像显示。`;
                // 自动播放
                await previewVideo.play();
            } catch (err) {
                console.error('预览失败', err);
                detailMsgDiv.innerHTML = `❌ 无法打开摄像头 “${deviceLabel || deviceId}” : ${err.message}`;
                stopPreview();
            }
        }

        // 枚举所有视频输入设备并展示列表
        async function enumerateAndDisplay() {
            // 清空区域，显示加载中
            deviceListArea.innerHTML = '<div style="text-align: center; color: #6c86a3;">🔍 正在获取设备列表，请确保已授权摄像头...</div>';
            
            try {
                // 首先请求权限（如果之前没权限会弹窗，如果已有权限则直接获取设备列表）
                const tempStream = await navigator.mediaDevices.getUserMedia({ video: true });
                // 拿到权限后立即关闭临时流，避免占用
                tempStream.getTracks().forEach(track => track.stop());
                permStatusDiv.innerHTML = '✅ 摄像头权限已获得，正在列出设备...';
                permStatusDiv.classList.remove('error-msg');
                
                // 获取所有媒体设备
                const devices = await navigator.mediaDevices.enumerateDevices();
                const videoDevices = devices.filter(device => device.kind === 'videoinput');
                
                if (videoDevices.length === 0) {
                    deviceListArea.innerHTML = '<div style="padding: 20px; text-align:center;">📭 未检测到任何摄像头设备。请检查驱动或外接摄像头。</div>';
                    return;
                }
                
                // 构建列表HTML
                let html = `<div style="margin-bottom: 8px; font-weight:600;">🎥 找到 ${videoDevices.length} 个摄像头设备</div>`;
                videoDevices.forEach((device, idx) => {
                    const label = device.label || `摄像头 ${idx+1} (未命名)`;
                    const deviceIdShort = device.deviceId.substring(0, 12) + '...';
                    html += `
                        <div class="device-item" data-device-id="${device.deviceId}" data-device-label="${escapeAttr(label)}">
                            <div class="device-name">📹 ${escapeHtml(label)}</div>
                            <div class="device-id">ID: ${deviceIdShort}</div>
                            <button class="preview-btn" data-id="${device.deviceId}" data-label="${escapeAttr(label)}">🔍 预览</button>
                        </div>
                    `;
                });
                deviceListArea.innerHTML = html;
                
                // 绑定所有预览按钮
                document.querySelectorAll('.preview-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const devId = btn.getAttribute('data-id');
                        const devLabel = btn.getAttribute('data-label');
                        if (devId) startPreview(devId, devLabel);
                        else detailMsgDiv.innerHTML = '⚠️ 无法获取设备ID';
                    });
                });
                
                permStatusDiv.innerHTML = `✅ 检测到 ${videoDevices.length} 个摄像头，点击「预览」可测试画面。`;
            } catch (err) {
                console.error('枚举设备错误', err);
                let errorMsg = '';
                if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                    errorMsg = '摄像头权限被拒绝。请点击浏览器地址栏右侧的摄像头图标，允许访问摄像头，然后刷新页面或点击「刷新设备列表」。';
                } else if (err.name === 'NotFoundError') {
                    errorMsg = '未找到摄像头设备。请检查电脑是否已连接摄像头并安装驱动。';
                } else if (err.name === 'NotReadableError') {
                    errorMsg = '摄像头被其他应用程序占用，请关闭其他使用摄像头的软件后重试。';
                } else {
                    errorMsg = `错误: ${err.message}`;
                }
                permStatusDiv.innerHTML = `❌ ${errorMsg}`;
                permStatusDiv.classList.add('error-msg');
                deviceListArea.innerHTML = `<div style="padding: 20px; text-align:center;">⚠️ 无法获取设备列表: ${errorMsg}<br>请刷新页面并允许摄像头权限。</div>`;
            }
        }

        // 辅助函数: 防XSS
        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
                return c;
            });
        }
        function escapeAttr(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        // 页面加载时自动检测
        async function autoCheck() {
            await enumerateAndDisplay();
        }

        // 刷新按钮
        refreshBtn.addEventListener('click', async () => {
            stopPreview();
            await enumerateAndDisplay();
        });

        // 停止预览按钮
        stopPreviewBtn.addEventListener('click', () => {
            stopPreview();
        });

        // 监听设备变化（例如插拔摄像头）
        if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
            navigator.mediaDevices.addEventListener('devicechange', () => {
                detailMsgDiv.innerHTML = '🔄 检测到设备变化，建议点击「刷新设备列表」更新。';
            });
        }

        autoCheck();
    })();
</script>
</body>
</html>
