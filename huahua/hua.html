<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>向日葵 · 向阳而生 | 手捧叶 · 花盘随鼠标转动</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #fef7e0 0%, #fff3e0 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, 'Roboto', sans-serif;
      cursor: crosshair;
      padding: 1rem;
    }

    .stage {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .sunflower {
      position: relative;
      width: 360px;
      height: 500px;
      filter: drop-shadow(0 16px 24px rgba(0, 0, 0, 0.12));
      transition: filter 0.2s;
    }

    /* ========= 花头区域 (可旋转的花盘 + 花瓣) ———— 完全保持原样 ========= */
    .head {
      position: absolute;
      left: 50%;
      top: 34%;
      transform: translate(-50%, -50%) rotate(0deg);
      transform-origin: 50% 72%;
      transition: transform 0.05s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      z-index: 20;
      width: 190px;
      height: 190px;
      pointer-events: none;
    }

    .petal {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 56px;
      height: 132px;
      background: radial-gradient(ellipse at 30% 40%, #ffdd66, #ffb347);
      border-radius: 48% 52% 45% 55% / 60% 55% 45% 40%;
      transform-origin: 50% 66px;
      box-shadow: 0 8px 14px rgba(0, 0, 0, 0.08), inset 0 -2px 0 rgba(0, 0, 0, 0.05);
    }

    .petal.p1 { transform: translate(-50%, -50%) rotate(0deg)   translateY(-80px); }
    .petal.p2 { transform: translate(-50%, -50%) rotate(30deg)  translateY(-80px); }
    .petal.p3 { transform: translate(-50%, -50%) rotate(60deg)  translateY(-80px); }
    .petal.p4 { transform: translate(-50%, -50%) rotate(90deg)  translateY(-80px); }
    .petal.p5 { transform: translate(-50%, -50%) rotate(120deg) translateY(-80px); }
    .petal.p6 { transform: translate(-50%, -50%) rotate(150deg) translateY(-80px); }
    .petal.p7 { transform: translate(-50%, -50%) rotate(180deg) translateY(-80px); }
    .petal.p8 { transform: translate(-50%, -50%) rotate(210deg) translateY(-80px); }
    .petal.p9 { transform: translate(-50%, -50%) rotate(240deg) translateY(-80px); }
    .petal.p10{ transform: translate(-50%, -50%) rotate(270deg) translateY(-80px); }
    .petal.p11{ transform: translate(-50%, -50%) rotate(300deg) translateY(-80px); }
    .petal.p12{ transform: translate(-50%, -50%) rotate(330deg) translateY(-80px); }

    .center {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 92px;
      height: 92px;
      background: radial-gradient(circle at 35% 30%, #b87a3c, #4e2e1a);
      border-radius: 50%;
      box-shadow: 0 14px 20px rgba(0, 0, 0, 0.3), inset 0 2px 4px rgba(255, 245, 170, 0.6);
      z-index: 25;
      border: 2px solid #e9b35f;
    }

    .center::after {
      content: "";
      position: absolute;
      top: 10%;
      left: 10%;
      width: 80%;
      height: 80%;
      background: radial-gradient(circle, #6b3f1c 2px, transparent 2px);
      background-size: 10px 10px;
      border-radius: 50%;
      opacity: 0.45;
      pointer-events: none;
    }

    /* ========= 茎 ———— 保持原样 ========= */
    .stem {
      position: absolute;
      left: 50%;
      top: 52%;
      transform: translateX(-50%);
      width: 14px;
      height: 228px;
      background: linear-gradient(135deg, #28965c, #1b6e45);
      border-radius: 20px;
      z-index: 5;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2);
    }

    /* ========= 叶子全新设计 ———— 只改动此区域 ========= */
    /* 
      目标：上半部分远离叶茎，下半部分靠近叶茎，左右完美对称，形似双手捧托。
      实现方式：
      - 叶片基部（下半部分）收窄并紧贴茎干，叶尖（上半部分）宽大并向两侧舒展远离。
      - 左叶基部位于茎左侧，向右上方向自然延伸；右叶镜像对称。
      - 通过特定的 border-radius 使叶片形态“上宽下窄”，配合旋转和定位让基部贴近茎。
    */
    .leaf {
      position: absolute;
      z-index: 10;
      pointer-events: none;
      transition: all 0.15s ease;
    }

    /* 左叶：下半部分（右侧）紧贴茎，上半部分向左上方舒展远离 */
    .leaf.left {
      width: 118px;
      height: 148px;
      background: linear-gradient(138deg, #2fbb6e, #188a4c);
      box-shadow: 0 12px 18px rgba(0, 0, 0, 0.2), inset -1px -2px 0 rgba(0, 0, 0, 0.05);
      /* 圆角设计：右下角尖锐收窄（贴近茎），左上角圆润宽大（远离茎） */
      border-radius: 85% 20% 75% 30% / 65% 28% 72% 35%;
      transform-origin: 92% 58%;   /* 旋转中心在右下角基部，使叶片绕茎侧转动，上部分自然远离 */
      transform: rotate(-48deg);
      /* 精准定位：让叶片右侧边缘恰好贴合茎的左侧 */
      left: calc(50% - 68px);
      top: calc(52% + 58px);
    }

    /* 右叶：完全镜像左叶，以茎为轴对称，上半部分向右上方舒展远离 */
    .leaf.right {
      width: 118px;
      height: 148px;
      background: linear-gradient(225deg, #32be72, #20a45e);
      box-shadow: 0 12px 18px rgba(0, 0, 0, 0.2), inset 2px -1px 0 rgba(0, 0, 0, 0.05);
      /* 圆角与左叶完全对称（镜像） */
      border-radius: 20% 85% 30% 75% / 28% 65% 35% 72%;
      transform-origin: 8% 58%;    /* 旋转中心在左下角基部，贴合茎右侧 */
      transform: rotate(48deg);
      left: calc(50% - 6px);       /* 让叶片左侧边缘贴合茎的右侧 */
      top: calc(52% + 58px);
    }

    /* 叶脉细节（不破坏对称，提升质感） */
    .leaf.left::before {
      content: "";
      position: absolute;
      top: 28%;
      left: 18%;
      width: 52%;
      height: 46%;
      background: radial-gradient(ellipse, rgba(255, 255, 210, 0.35) 0%, transparent 70%);
      border-radius: 50%;
      transform: rotate(-18deg);
      pointer-events: none;
    }

    .leaf.right::before {
      content: "";
      position: absolute;
      top: 28%;
      right: 18%;
      width: 52%;
      height: 46%;
      background: radial-gradient(ellipse, rgba(255, 255, 210, 0.35) 0%, transparent 70%);
      border-radius: 50%;
      transform: rotate(18deg);
      pointer-events: none;
    }

    /* 基部与茎衔接的柔和阴影 */
    .leaf.left::after {
      content: "";
      position: absolute;
      bottom: 4%;
      right: 6%;
      width: 28px;
      height: 28px;
      background: radial-gradient(circle, #1c7547, transparent);
      opacity: 0.4;
      border-radius: 50%;
      filter: blur(4px);
      pointer-events: none;
    }

    .leaf.right::after {
      content: "";
      position: absolute;
      bottom: 4%;
      left: 6%;
      width: 28px;
      height: 28px;
      background: radial-gradient(circle, #1c7547, transparent);
      opacity: 0.4;
      border-radius: 50%;
      filter: blur(4px);
      pointer-events: none;
    }

    /* 提示标签 — 完全保持原样 */
    .hint {
      position: absolute;
      left: 50%;
      bottom: -48px;
      transform: translateX(-50%);
      font-size: 14px;
      font-weight: 500;
      background: rgba(255, 245, 210, 0.9);
      backdrop-filter: blur(8px);
      padding: 6px 24px;
      border-radius: 48px;
      color: #6b3f1c;
      white-space: nowrap;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.1);
      letter-spacing: 0.5px;
      font-family: inherit;
      border: 1px solid #ffda9e;
      pointer-events: none;
      z-index: 30;
    }

    /* 整体微光呼吸效果 */
    @keyframes subtleGlow {
      0% { filter: drop-shadow(0 8px 18px rgba(0, 0, 0, 0.08));}
      100% { filter: drop-shadow(0 14px 26px rgba(0, 0, 0, 0.14));}
    }
    .sunflower {
      animation: subtleGlow 3s infinite alternate ease-in-out;
    }

    /* 响应式微调 */
    @media (max-width: 600px) {
      .sunflower {
        transform: scale(0.88);
      }
      .hint {
        font-size: 11px;
        white-space: nowrap;
        bottom: -52px;
      }
      .stage {
        padding: 0 0 32px 0;
      }
    }
  </style>
</head>
<body>
<div class="stage">
  <div class="sunflower" id="sunflower">
    <!-- 可旋转花头（花瓣+花心） -->
    <div class="head" id="sun-head">
      <div class="petal p1"></div>
      <div class="petal p2"></div>
      <div class="petal p3"></div>
      <div class="petal p4"></div>
      <div class="petal p5"></div>
      <div class="petal p6"></div>
      <div class="petal p7"></div>
      <div class="petal p8"></div>
      <div class="petal p9"></div>
      <div class="petal p10"></div>
      <div class="petal p11"></div>
      <div class="petal p12"></div>
      <div class="center"></div>
    </div>
    <!-- 茎 -->
    <div class="stem"></div>
    <!-- 全新手捧叶：左右完美对称，上半部分远离叶茎，下半部分自然收拢贴近茎 -->
    <div class="leaf left"></div>
    <div class="leaf right"></div>
    <div class="hint">🌻 鼠标移动 · 花盘追随太阳 (鼠标) 🌞</div>
  </div>
</div>

<script>
  (function() {
    const headElement = document.getElementById('sun-head');
    const sunflowerContainer = document.getElementById('sunflower');
    if (!headElement || !sunflowerContainer) return;

    let targetDeg = 0;
    let currentDeg = 0;
    const MAX_ANGLE = 52;
    const DAMPING = 0.2;
    
    function calculateAngleFromMouse(clientX, clientY) {
      const rect = headElement.getBoundingClientRect();
      const pivotX = rect.left + rect.width / 2;
      const pivotY = rect.top + rect.height * 0.72;
      const dx = clientX - pivotX;
      const dy = clientY - pivotY;
      let rawAngle = Math.atan2(dx, -dy) * 180 / Math.PI;
      let clamped = Math.max(-MAX_ANGLE, Math.min(MAX_ANGLE, rawAngle));
      if (Math.abs(clamped) < 0.4) clamped = 0;
      return clamped;
    }
    
    function handleMove(clientX, clientY) {
      if (clientX === undefined || clientY === undefined) return;
      targetDeg = calculateAngleFromMouse(clientX, clientY);
    }
    
    window.addEventListener('mousemove', (e) => {
      handleMove(e.clientX, e.clientY);
    });
    
    window.addEventListener('touchmove', (e) => {
      if (e.touches && e.touches.length) {
        const touch = e.touches[0];
        handleMove(touch.clientX, touch.clientY);
        e.preventDefault();
      }
    }, { passive: false });
    
    window.addEventListener('mouseleave', () => {
      targetDeg = 0;
    });
    
    window.addEventListener('touchend', () => {
      targetDeg = 0;
    });
    
    function animateRotation() {
      currentDeg += (targetDeg - currentDeg) * DAMPING;
      headElement.style.transform = `translate(-50%, -50%) rotate(${currentDeg.toFixed(2)}deg)`;
      requestAnimationFrame(animateRotation);
    }
    
    animateRotation();
    
    let resizeTimer;
    window.addEventListener('resize', () => {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {}, 100);
    });
    
    setTimeout(() => {
      targetDeg = 0;
    }, 60);
  })();
</script>
</body>
</html>
